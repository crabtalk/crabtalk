syntax = "proto3";

package crabtalk.protocol;

option swift_prefix = "CrabtalkProto_";

// ── Client Messages ──────────────────────────────────────────────

message ClientMessage {
  // Tags 14 (SetLocalMcps), 35 (SetEnabled), and 47-50 (Setting RPCs)
  // were removed. MCPs are managed via UpsertMcp/DeleteMcp; per-agent
  // configuration lives directly on AgentConfig in storage.
  // Tags 8, 9, 10, 12 were the provider management RPCs
  // (ListProviders/SetProvider/DeleteProvider/ListProviderPresets).
  // Removed — crabtalk now talks to a single OpenAI-compatible endpoint;
  // model routing is the LLM gateway's concern.
  reserved 14, 35, 47, 48, 49, 50;
  reserved "set_local_mcps", "set_enabled", "get_setting", "set_setting",
      "delete_setting", "list_settings";
  reserved 8, 9, 10, 12;
  reserved "list_providers", "set_provider", "delete_provider",
      "list_provider_presets";
  // Tags 27-29 were the cron management RPCs (CreateCron/DeleteCron/ListCrons).
  // Removed — cron now lives as a standalone service outside the daemon.
  reserved 27, 28, 29;
  reserved "create_cron", "delete_cron", "list_crons";
  // Tags 24, 25, 26 were StartService/StopService/ServiceLogs.
  // Removed — service management moved out of the daemon into crabup.
  reserved 24, 25, 26;
  reserved "start_service", "stop_service", "service_logs";
  // Tags 20, 21, 22, 37 were InstallPlugin/UninstallPlugin/ListPlugins/SearchPlugins.
  // Removed — package management moved out of the daemon into crabup.
  reserved 20, 21, 22, 37;
  reserved "install_plugin", "uninstall_plugin", "list_plugins", "search_plugins";
  // Tag 44 was SteerSessionMsg. Steering is a client composition of
  // cancel_stream + stream; the wire only carries the cancel.
  reserved 44;
  reserved "steer_session";
  // Tag 32 was ReloadMsg. Config is not edited on a live daemon —
  // model changes go through set_active_model.
  reserved 32;
  reserved "reload";

  oneof msg {
    // Execution
    SendMsg send = 1;
    StreamMsg stream = 2;
    // Conversation management
    ListActiveConversationsMsg list_active_conversations = 4;
    KillMsg kill = 5;
    CompactMsg compact = 6;
    ListConversationsMsg list_conversations = 7;
    // Active model
    SetActiveModelMsg set_active_model = 11;
    // MCP management
    ListMcpsMsg list_mcps = 13;
    UpsertMcpMsg upsert_mcp = 45;
    DeleteMcpMsg delete_mcp = 46;
    ReconnectMcpMsg reconnect_mcp = 54;
    // Agent management
    ListAgentsMsg list_agents = 15;
    GetAgentMsg get_agent = 16;
    CreateAgentMsg create_agent = 17;
    UpdateAgentMsg update_agent = 18;
    DeleteAgentMsg delete_agent = 19;
    RenameAgentMsg rename_agent = 51;
    // Skills
    ListSkillsMsg list_skills = 23;
    GetSkillMsg get_skill = 55;
    // Models
    ListModelsMsg list_models = 36;
    // Conversation history
    GetConversationHistoryMsg get_conversation_history = 38;
    // Session search
    SearchSessionsMsg search_sessions = 56;
    // Delete conversation
    DeleteConversationMsg delete_conversation = 39;
    // Daemon lifecycle
    Ping ping = 30;
    GetConfig get_config = 31;
    GetStats get_stats = 33;
    SubscribeEvents subscribe_events = 34;
    // Event bus
    SubscribeEventMsg subscribe_event = 40;
    UnsubscribeEventMsg unsubscribe_event = 41;
    ListSubscriptionsMsg list_subscriptions = 42;
    PublishEventMsg publish_event = 43;
    // Cancel the in-flight stream for a session.
    CancelStreamMsg cancel_stream = 57;
    // MCP lifecycle event subscription
    SubscribeMcpEventsMsg subscribe_mcp_events = 52;
    // Extension point for downstream products.
    bytes extension = 100;
  }
  // Client-tool forwarding, removed.
  reserved 3, 53;
}

message SendMsg {
  // The agent's ULID. Resolve a name with GetAgent.
  string agent = 1;
  string content = 2;
  optional string sender = 4;
  // tag 5 was `cwd` — removed. The daemon does not read the user's
  // filesystem. Clients render local instructions (e.g. Crab.md) into
  // `content` themselves.
  reserved 5;
  reserved "cwd";
  // Tag 6 was `guest` — no handler ever read it, and only the streaming
  // path runs a guest turn.
  reserved 6;
  reserved "guest";
  optional string tool_choice = 7;
  reserved 8;
  reserved "tools";
}

message StreamMsg {
  // The agent's ULID. Resolve a name with GetAgent.
  string agent = 1;
  string content = 2;
  optional string sender = 4;
  reserved 5;
  reserved "cwd";
  // The agent answering this turn in the primary's session, if not the
  // primary itself.
  optional string guest = 6;
  optional string tool_choice = 7;
  reserved 8;
  reserved "tools";
  // Run an anonymous, unpersisted turn: no conversation is created and
  // nothing reaches session storage. Events stream back normally and are
  // broadcast tagged `ephemeral` under `correlation_id`.
  bool ephemeral = 9;
  // Caller-chosen id used to tag the ephemeral broadcast so observers can
  // group its events. Ignored unless `ephemeral` is set.
  optional uint64 correlation_id = 10;
}


message Ping {}
message SubscribeEvents {}

message ListActiveConversationsMsg {
  string agent = 1;
  string sender = 2;
}
message GetConfig {}
message GetStats {}

message KillMsg {
  string agent = 1;
  string sender = 2;
}

message CancelStreamMsg {
  string agent = 1;
  string sender = 2;
}

// ── Event Bus ───────────────────────────────────────────────────

message SubscribeEventMsg {
  string source = 1;
  string target_agent = 2;
  bool once = 3;
}

message UnsubscribeEventMsg {
  uint64 id = 1;
}

message ListSubscriptionsMsg {}

message PublishEventMsg {
  string source = 1;
  string payload = 2;
}

message SubscriptionInfo {
  uint64 id = 1;
  string source = 2;
  string target_agent = 3;
  bool once = 4;
}

message SubscriptionList {
  repeated SubscriptionInfo subscriptions = 1;
}

message CompactMsg {
  string agent = 1;
  string sender = 2;
  // Summarization instructions for the compaction LLM call. The daemon
  // carries no built-in prompt — the client decides how a summary reads.
  string prompt = 3;
}

message ListAgentsMsg {}

// The one name-keyed agent RPC: it *is* the name→id resolver. Every
// other agent operation takes the ULID this returns.
message GetAgentMsg {
  string name = 1;
}

message CreateAgentMsg {
  string name = 1;
  // JSON-encoded `AgentConfig`. The description travels inside it — it is
  // the system message, so a second field for the prompt would be the same
  // text twice.
  string config = 2;
  reserved 3;
  reserved "prompt";
}

message UpdateAgentMsg {
  // Tag 1 was `name`: an agent was addressed by one. It is the ULID now.
  reserved 1;
  reserved "name";
  string agent = 4;
  // Merge patch over the stored config. An `id` inside it is ignored —
  // identity comes from `agent`, never from the body.
  string config = 2;
  reserved 3;
  reserved "prompt";
}

message DeleteAgentMsg {
  // Tag 1 was `name`.
  reserved 1;
  reserved "name";
  string agent = 2;
}

message RenameAgentMsg {
  // Tag 1 was `old_name`: the rename addressed the agent by the name it
  // was losing. It is the ULID now, which the rename leaves alone.
  reserved 1;
  reserved "old_name";
  string agent = 3;
  string new_name = 2;
}

message ListSkillsMsg {}

message GetSkillMsg {
  string name = 1;
}

message ListModelsMsg {}

message GetConversationHistoryMsg {
  string file_path = 1;
}

message ConversationMessage {
  string role = 1;
  string content = 2;
}

message ConversationHistory {
  repeated ConversationMessage messages = 1;
  string title = 2;
  reserved 3;
  reserved "agent";
  string agent_id = 4;
  string agent_name = 5;
}

enum SourceKind {
  SOURCE_KIND_UNKNOWN = 0;
  LOCAL = 1;
  PACKAGE = 2;
  EXTERNAL = 3;
}

message ListConversationsMsg {
  // Empty means unrestricted.
  string agent = 1;
  string sender = 2;
}

message SearchSessionsMsg {
  string query = 1;
  // Absent means the server's default; the server clamps its own caps.
  // Optional rather than a zero sentinel, because zero context is a
  // thing a caller may legitimately want.
  optional uint32 limit = 2;
  optional uint32 context_before = 3;
  optional uint32 context_after = 4;
  // Empty means unrestricted. A caller reaching this through a harness
  // does not get to choose: the grant overwrites both filters.
  string agent = 5;
  string sender = 6;
}

// One message inside a hit's window. `role` and `tool_name` travel raw —
// composing a label out of them is presentation, and belongs to whatever
// is doing the presenting.
message SessionWindowItem {
  string role = 1;
  uint32 msg_idx = 2;
  string snippet = 3;
  bool truncated = 4;
  string tool_name = 5;
}

message SessionHit {
  string session_handle = 1;
  uint32 msg_idx = 2;
  double score = 3;
  string title = 4;
  reserved 5;
  reserved "agent";
  string agent_id = 10;
  // The agent's name at query time. A hit is rendered to a human or a
  // model, and a bare ULID names nothing. Empty if the agent is gone.
  string agent_name = 11;
  string sender = 6;
  string created_at = 7;
  string updated_at = 8;
  repeated SessionWindowItem window = 9;
}

message SessionHitList {
  repeated SessionHit hits = 1;
}

message ListMcpsMsg {
  // Optional — when non-empty, list only this agent's declared MCPs.
  // Empty = union view across every registered agent.
  string agent = 1;
}

message UpsertMcpMsg {
  // JSON-encoded `McpServerConfig`. The MCP name lives inside the
  // payload — there is no separate identity field.
  string config = 1;
  // Required — the agent whose `mcps` list is being modified.
  string agent = 2;
}

message DeleteMcpMsg {
  string name = 1;
  // Required — the agent whose `mcps` list is being modified.
  string agent = 2;
}

// Drop and re-establish the peer backing an already-registered MCP.
// Changes nothing on disk — for a new config, use UpsertMcp instead.
message ReconnectMcpMsg {
  string name = 1;
  // Required — the agent that declared this MCP.
  string agent = 2;
}

message SetActiveModelMsg {
  string model = 1;
}

// ── Server Messages ──────────────────────────────────────────────

message ServerMessage {
  // Tags 27-28 (SettingValue, SettingList) were removed with the
  // settings RPCs.
  // Tags 8, 9 were ProviderList / ProviderPresetList — removed with the
  // provider management RPCs.
  reserved 27, 28;
  reserved "setting_value", "setting_list";
  reserved 8, 9;
  reserved "provider_list", "provider_preset_list";
  // Tags 17, 18 were CronInfo/CronList — removed with the cron extraction.
  reserved 17, 18;
  reserved "cron_info", "cron_list";
  // Tag 16 was ServiceLogOutput — removed with service management.
  reserved 16;
  reserved "service_log_output";
  // Tags 13, 14, 23 were PluginEvent/PluginList/PluginSearchList.
  // Removed — package management moved out of the daemon into crabup.
  reserved 13, 14, 23;
  reserved "plugin_event", "plugin_list", "plugin_search_list";

  oneof msg {
    // Common
    ErrorMsg error = 1;
    Pong pong = 2;
    // Execution
    SendResponse response = 3;
    StreamEvent stream = 4;
    // Active conversations
    ActiveConversationList active_conversations = 5;
    CompactResponse compact = 6;
    ConversationList conversation_list = 7;
    // MCP
    McpList mcp_list = 10;
    // Agent
    AgentInfo agent_info = 11;
    AgentList agent_list = 12;
    // Skills
    SkillList skill_list = 15;
    SkillBody skill_body = 31;
    // Models
    ModelList model_list = 22;
    // Conversation history
    ConversationHistory conversation_history = 24;
    // Session search
    SessionHitList session_hits = 32;
    // Lifecycle
    ConfigMsg config = 19;
    Stats stats = 20;
    AgentEventMsg agent_event = 21;
    // Event bus
    SubscriptionInfo subscription_info = 25;
    SubscriptionList subscription_list = 26;
    // MCP CRUD response (single-item)
    McpInfo mcp_info = 29;
    // MCP lifecycle event
    McpEventMsg mcp_event = 30;
    // Extension point for downstream products.
    bytes extension = 100;
  }
}

message Stats {
  uint64 uptime_secs = 1;
  uint32 active_conversations = 2;
  uint32 registered_agents = 3;
  string active_model = 4;
}

message Pong {}

message CompactResponse {
  string summary = 1;
}

message TokenUsage {
  uint32 prompt_tokens = 1;
  uint32 completion_tokens = 2;
  uint32 total_tokens = 3;
  optional uint32 cache_hit_tokens = 4;
  optional uint32 cache_miss_tokens = 5;
  optional uint32 reasoning_tokens = 6;
}

message SendResponse {
  string agent = 1;
  string content = 2;
  string model = 5;
  optional TokenUsage usage = 6;
  reserved 3, 4;
  reserved "provider";
}

message ToolCallInfo {
  string name = 1;
  string arguments = 2;
}

message StreamEvent {
  oneof event {
    StreamStart start = 1;
    StreamChunk chunk = 2;
    StreamThinking thinking = 3;
    ToolStartEvent tool_start = 4;
    ToolResultEvent tool_result = 5;
    ToolsCompleteEvent tools_complete = 6;
    StreamEnd end = 7;
    TextStartEvent text_start = 10;
    TextEndEvent text_end = 11;
    ThinkingStartEvent thinking_start = 12;
    ThinkingEndEvent thinking_end = 13;
    ContextUsageEvent context_usage = 14;
  }
  // Client-tool forwarding, removed.
  reserved 8, 15;
  // UserSteered, removed with the steering RPC.
  reserved 9;
}



// Real token counts reported by the provider after a completed step.
// Emitted once per LLM call so clients can detect context pressure
// and decide when to call compact_conversation. The daemon does not
// act on this — policy is the client's.
message ContextUsageEvent {
  TokenUsage usage = 1;
}

// Tag 1 on each of these was `agent`, an agent name.
message TextStartEvent {
  string agent = 1;
}
message TextEndEvent {
  string agent = 1;
}
message ThinkingStartEvent {
  string agent = 1;
}
message ThinkingEndEvent {
  string agent = 1;
}

message StreamStart {
  string agent = 1;
}

message StreamChunk {
  string content = 1;
}

message StreamThinking {
  string content = 1;
}

message ToolStartEvent {
  repeated ToolCallInfo calls = 1;
}

message ToolResultEvent {
  string call_id = 1;
  string output = 2;
  uint64 duration_ms = 3;
  // True when the dispatcher reported the tool result as an error.
  // `output` still carries the (error) text so existing clients can
  // render it; new clients use this flag for structured handling.
  bool is_error = 4;
}

message ToolsCompleteEvent {}

message StreamEnd {
  string agent = 1;
  string error = 2;
  string model = 4;
  optional TokenUsage usage = 5;
  reserved 3;
  reserved "provider";
}





message ErrorMsg {
  uint32 code = 1;
  string message = 2;
}

message ActiveConversationInfo {
  reserved 1;
  reserved "agent";
  string agent_id = 6;
  string agent_name = 7;
  string sender = 2;
  uint64 message_count = 3;
  uint64 alive_secs = 4;
  string title = 5;
}

enum AgentEventKind {
  TEXT_DELTA = 0;
  THINKING_DELTA = 1;
  TOOL_START = 2;
  TOOL_RESULT = 3;
  TOOLS_COMPLETE = 4;
  DONE = 5;
  TEXT_START = 6;
  TEXT_END = 7;
  THINKING_START = 8;
  THINKING_END = 9;
}

message AgentEventMsg {
  string agent = 1;
  string sender = 2;
  AgentEventKind kind = 3;
  // Human-readable label (e.g. "bash, read_file" for TOOL_START,
  // "342ms" for TOOL_RESULT, full text for TEXT_DELTA). Existing
  // consumers like the CLI use this for display.
  string content = 4;
  string timestamp = 5;
  // Structured payload — populated for kinds that benefit from it.
  // Rich UI clients should prefer these over parsing `content`.
  // - TOOL_START: tool calls with names and arguments
  repeated ToolCallInfo tool_calls = 6;
  // - TOOL_RESULT: tool output (may be truncated for size)
  string tool_output = 7;
  // - TOOL_RESULT: true when the dispatcher reported the tool as errored.
  bool tool_is_error = 8;
  // True when this event belongs to an ephemeral (anonymous, unpersisted)
  // turn. Consumers should surface progress but must not treat `sender`
  // as a conversation id — there is no session behind it.
  bool ephemeral = 9;
}

message ActiveConversationList {
  repeated ActiveConversationInfo conversations = 1;
}

message ConfigMsg {
  string config = 1;
}

message AgentInfo {
  // The agent's ULID — what every other agent RPC takes.
  string id = 12;
  string name = 1;
  string description = 2;
  string config = 3; // full AgentConfig as JSON — round-trip with CreateAgentMsg/UpdateAgentMsg
  string model = 4;
  uint32 max_iterations = 5;
  bool thinking = 6;
  repeated string skills = 8;
  repeated string mcps = 9;
  uint32 compact_tool_max_len = 11;
  reserved 7, 10;
  reserved "members", "compact_threshold";
}

message AgentList {
  repeated AgentInfo agents = 1;
}

message SkillInfo {
  string name = 1;
  // Tags 2-4 were `enabled`, then `source`/`source_kind` from the package
  // manifest design. Reserved until packages are redesigned.
  reserved 2, 3, 4;
  reserved "enabled", "source", "source_kind";
  // What the skill is for. The catalogue is chosen from by description, so
  // a listing without one cannot be selected from.
  string description = 5;
}

message SkillList {
  repeated SkillInfo skills = 1;
}

// One skill's instructions. Separate from the listing because a catalogue
// carrying every body is a context tax paid on every request.
message SkillBody {
  string name = 1;
  string body = 2;
}

message ModelInfo {
  string name = 1;
  bool active = 3;
  reserved 2, 4, 5;
  reserved "provider", "enabled", "kind";
}

message ModelList {
  repeated ModelInfo models = 1;
}

message DeleteConversationMsg {
  string file_path = 1;
}

message ConversationInfo {
  reserved 1;
  reserved "agent";
  string agent_id = 9;
  string agent_name = 10;
  string sender = 2;
  uint32 seq = 3;
  string title = 4;
  string file_path = 5;
  uint64 message_count = 6;
  uint64 alive_secs = 7;
  string date = 8;
}

message ConversationList {
  repeated ConversationInfo conversations = 1;
}

enum McpStatus {
  MCP_STATUS_UNKNOWN = 0;
  CONNECTED = 1;
  DISCONNECTED = 2;
  FAILED = 3;
  CONNECTING = 4;
}

message McpInfo {
  string name = 1;
  string command = 2;
  repeated string args = 3;
  map<string, string> env = 4;
  string url = 5;
  // Full `Authorization` header value (e.g. `"Bearer eyJ..."`) sent on
  // every HTTP-transport request. Empty string = no header.
  string auth = 6;
  string source = 7;
  bool auto_restart = 8;
  reserved 9;
  reserved "enabled";
  SourceKind source_kind = 10;
  McpStatus status = 11;
  string error = 12;
  uint32 tool_count = 13;
}

message McpList {
  repeated McpInfo mcps = 1;
}

message SubscribeMcpEventsMsg {}

enum McpEventKind {
  MCP_EVENT_KIND_UNKNOWN = 0;
  MCP_EVENT_KIND_CONNECTING = 1;
  MCP_EVENT_KIND_CONNECTED = 2;
  MCP_EVENT_KIND_FAILED = 3;
  MCP_EVENT_KIND_DISCONNECTED = 4;
}

message McpEventMsg {
  McpEventKind kind = 1;
  string name = 2;
  // Populated for CONNECTED.
  repeated string tools = 3;
  // Populated for FAILED.
  string error = 4;
  string timestamp = 5;
  // The ULID of the agent whose declaration produced this event.
  // Identical configs across agents share one peer, but events still fire
  // per (agent, name) so consumers see lifecycle from each owner's point
  // of view.
  string agent = 6;
}

