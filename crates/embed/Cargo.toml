[package]
name = "crabtalk-embed"
description = "Shared 384-dim MiniLM (all-MiniLM-L6-v2) text embedder for Crabtalk — cloud and desktop embed with identical code so vectors are comparable."
documentation = "https://docs.rs/crabtalk-embed"
readme = "README.md"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true

[features]
# Run inference on the macOS GPU (fp16). Off by default → CPU (fp32), the path
# the cloud and non-mac builds take.
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]

[dependencies]
candle-core.workspace = true
candle-nn.workspace = true
candle-transformers.workspace = true
tokenizers.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
