[package]
name = "crabtalk"
description = "Crabtalk library"
documentation = "https://docs.rs/crabtalk-node"
readme = "README.md"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true

[dependencies]
crabllm-core.workspace = true
crabllm-provider = { workspace = true, features = ["hyper"] }
crabllm-sdk = { workspace = true, features = ["hyper"] }
crabtalk-berm.workspace = true
hooks = { workspace = true, default-features = false, features = [
    "memory",
    "mcp",
] }
mcp = { workspace = true, default-features = false, features = ["hyper"] }
proto = { workspace = true, features = ["llm", "server"] }
runtime.workspace = true
skill.workspace = true
transport.workspace = true
wcore.workspace = true

# crates.io
anyhow.workspace = true
bytes.workspace = true
chrono.workspace = true
async-stream.workspace = true
futures-core.workspace = true
futures-util.workspace = true
parking_lot.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yml.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
ulid.workspace = true

[features]
default = ["native-tls"]
native-tls = [
    "crabllm-provider/native-tls",
    "crabllm-sdk/native-tls",
    "hooks/native-tls",
    "mcp/native-tls",
]
rustls = [
    "crabllm-provider/rustls",
    "crabllm-sdk/rustls",
    "hooks/rustls",
    "mcp/rustls",
]
