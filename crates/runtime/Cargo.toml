[package]
name = "crabtalk-runtime"
description = "Crabtalk agent runtime — execution loop, tool dispatch, and lifecycle hooks"
documentation = "https://docs.rs/crabtalk-runtime"
readme = "README.md"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true

[dependencies]
storage = { workspace = true, default-features = false }
memory.workspace = true
mcp = { workspace = true, default-features = false, features = ["hyper"] }
proto.workspace = true
crabllm-core.workspace = true
skill.workspace = true
schemars.workspace = true
heck.workspace = true

# crates.io
chrono.workspace = true
anyhow.workspace = true
async-stream.workspace = true
futures-core.workspace = true
futures-util.workspace = true
parking_lot.workspace = true
serde.workspace = true
dirs.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[features]
default = ["native-tls"]
native-tls = ["mcp/native-tls"]
rustls = ["mcp/rustls"]

[dev-dependencies]
