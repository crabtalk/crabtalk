# target specific settings
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

[target.x86_64-unknown-linux-gnu]
linker = "x86_64-linux-gnu-gcc"

# Guests. --emit-relocs keeps the relocations that identify indirect-call
# targets; without it rvtime cannot tell which functions have their address
# taken, and rejects the image. It lives here rather than in the guest crate so
# it applies wherever the build is invoked from.
[target.riscv64imac-unknown-none-elf]
rustflags = ["-Clink-arg=--emit-relocs"]
