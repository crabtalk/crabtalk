[workspace]
resolver = "3"
members = [
    "apps/*",
    "berm/*",
    "crates/*",
    "crates/berm/proto",
    "harness/*",
]

[workspace.package]
version = "0.0.23"
edition = "2024"
authors = ["clearloop <tianyi.gc@gmail.com>"]
license = "MIT"
repository = "https://github.com/crabtalk/crabtalk"
keywords = ["llm", "agent", "ai"]

[workspace.dependencies]
client = { path = "crates/client", package = "crabtalk-client", version = "0.0.23" }
cli = { path = "apps/tui", package = "crabtalk-cli", version = "0.0.23" }
crabtalk = { path = "crates/crabtalk", package = "crabtalk", version = "0.0.23", default-features = false }
crabtalkd = { path = "apps/daemon", package = "crabtalkd", version = "0.0.23" }
crabup = { path = "apps/crabup", package = "crabup", version = "0.0.23" }
runtime = { path = "crates/runtime", package = "crabtalk-runtime", version = "0.0.23" }
transport = { path = "crates/transport", package = "crabtalk-transport", version = "0.0.23" }
wcore = { path = "crates/core", package = "crabtalk-core", version = "0.0.23" }
memory = { path = "crates/memory", package = "crabtalk-memory", version = "0.0.23" }
embed = { path = "crates/embed", package = "crabtalk-embed", version = "0.0.23" }
hooks = { path = "crates/hooks", package = "crabtalk-hooks", version = "0.0.23", default-features = false }
storage = { path = "crates/storage", package = "crabtalk-storage", version = "0.0.23", default-features = false }
mcp = { path = "crates/mcp", package = "crabtalk-mcp", version = "0.0.23", default-features = false }
search = { path = "harness/search", package = "crabtalk-search", version = "0.0.23", default-features = false }
berm = { path = "berm/engine", version = "0.0.23" }
crabtalk-berm = { path = "crates/berm", version = "0.0.23" }
berm-sdk = { path = "berm/sdk", version = "0.0.23" }
berm-codegen = { path = "berm/codegen", version = "0.0.23" }
crabtalk-berm-proto = { path = "crates/berm/proto", version = "0.0.23" }

# rvtime
object = "0.40"
rvtime = "0.0.2"
rvtime-guest = { version = "0.0.2", default-features = false }
linked_list_allocator = "0.10"

# crabllm
crabllm-core = "0.0.23"
crabllm-sdk = { version = "0.0.23", default-features = false }
crabllm-provider = { version = "0.0.23", default-features = false }

# bench
criterion = { version = "0.5", features = ["html_reports"] }

# crabtalk-embed (text embedding — all-MiniLM-L6-v2 on Candle)
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
sha2 = "0.10"

# crates.io
base64 = "0.22"
bytes = "1"
anyhow = "1"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
async-stream = "0.3"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
console = "0.15"
crossterm = { version = "0.28", features = ["event-stream"] }
dialoguer = "0.11"
dirs = "6"
flate2 = "1"
heck = "0.5"
indicatif = "0.18"
futures-core = "0.3"
futures-util = "0.3"
lru = "0.14"
percent-encoding = "2"
rand = "0.9"
ratatui = "0.29"
scraper = "0.22"
prost = "0.13"
# prost for guests: no_std with an allocator, same reason as serde above.
prost_guest = { package = "prost", version = "0.13", default-features = false, features = [
    "derive",
] }
prost-build = "0.13"
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "json",
    "query",
    "stream",
] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
rmcp = { version = "1.3", default-features = false }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio", "http1"] }
http = "1"
http-body-util = "0.1"
hyper-tls = "0.6"
hyper-rustls = { version = "0.27", default-features = false, features = [
    "http1",
    "ring",
    "webpki-tokio",
] }
parking_lot = "0.12"
schemars = "1.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The same crates for guests, which are `no_std` with an allocator. Second
# entries rather than features on the first because a member cannot turn off
# default features it inherits, and every host member needs the std ones.
serde_guest = { package = "serde", version = "1", default-features = false, features = [
    "derive",
    "alloc",
] }
serde_json_guest = { package = "serde_json", version = "1", default-features = false, features = [
    "alloc",
] }
serde_yml = "0.0.12"
termimad = "0.34"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "io-util",
    "io-std",
    "net",
    "process",
    "sync",
    "time",
] }
textwrap = "0.16"
toml = "0.8"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
] }
tracing = "0.1"
ulid = { version = "1", features = ["serde"] }
tracing-subscriber = "0.3"
url = "2"

[profile.prod]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
debug-assertions = false
overflow-checks = false
strip = true

[workspace.metadata.conta]
ignore = []
