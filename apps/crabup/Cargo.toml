[package]
name = "crabup"
description = "Version manager for the Crabtalk ecosystem"
readme = "README.md"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true

[[bin]]
name = "crabup"
path = "src/bin/main.rs"
required-features = ["cmd"]

[features]
# Bare, this crate is the install layout and nothing else — that is what the
# rest of the workspace depends on. The commands come with `cmd`.
default = ["cmd"]
cmd = ["dep:anyhow", "dep:clap", "dep:toml"]

[dependencies]
dirs.workspace = true

anyhow = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
