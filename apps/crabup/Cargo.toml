[package]
name = "crabup"
description = "Version manager for the Crabtalk ecosystem"
readme = "README.md"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true

[[bin]]
name = "crabup"
path = "src/bin/main.rs"
required-features = ["cmd"]

[features]
# Bare, this crate is the install layout and nothing else — that is what the
# rest of the workspace depends on. The commands come with `cmd`.
default = ["cmd", "native-tls"]
cmd = [
    "dep:anyhow",
    "dep:clap",
    "dep:flate2",
    "dep:indicatif",
    "dep:reqwest",
    "dep:serde",
    "dep:serde_json",
    "dep:tar",
    "dep:toml",
]
native-tls = ["reqwest/native-tls"]
rustls = ["reqwest/rustls"]

[dependencies]
dirs.workspace = true

anyhow = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
indicatif = { workspace = true, optional = true }
reqwest = { workspace = true, default-features = false, features = [
    "blocking",
], optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
