name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: Linux
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      # - name: Install Toolchain
      #   run: rustup update stable && rustup default stable
      # - name: Install protoc
      #   uses: arduino/setup-protoc@v3
      # - uses: taiki-e/install-action@sccache
      # - uses: taiki-e/install-action@nextest

      - name: Run Tests
        run: cargo nextest run --workspace --no-fail-fast

  check:
    name: Check
    runs-on: Linux
    steps:
      - uses: actions/checkout@v4
      # - name: Install Toolchain
      #   run: |
      #     rustup update stable && rustup default stable
      #     rustup component add clippy rustfmt
      # - name: Install protoc
      #   uses: arduino/setup-protoc@v3
      # - uses: taiki-e/install-action@sccache
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all -- -D warnings

  guest:
    name: Guest
    runs-on: Linux
    steps:
      - uses: actions/checkout@v4
      - name: Install RISC-V target
        run: rustup target add riscv64imac-unknown-none-elf
      # Proves what only a real build can: that the macro's exports survive
      # --gc-sections, that --emit-relocs reached the linker, and that the
      # manifest section is where the host looks for it.
      - name: Build Guest
        run: cargo build --release -p spike --target riscv64imac-unknown-none-elf
      # The first real harness, and the one that proves capabilities: fs and
      # exec, bounded by a root the guest cannot widen.
      - name: Build OS Harness
        run: cargo build --release -p crabtalk-harness-os --target riscv64imac-unknown-none-elf
      # The protocol harness: proves the guest can carry the daemon's own
      # message types, which needs prost built without std.
      - name: Build Peers Harness
        run: cargo build --release -p crabtalk-harness-peers --target riscv64imac-unknown-none-elf
      # And that the host can compile, instantiate, and call it — the one
      # place rvtime itself runs in this repo's CI.
      - name: Run Guest
        run: cargo run --release --example measure -p crabtalk-harness
      # bash, read, and edit against a real directory, including the paths that
      # must be refused. Also covers the guest constructs a model's own output
      # reaches: an unknown argument and a wrong argument type.
      - name: Run OS Harness
        run: cargo run --release --example os -p crabtalk-harness
      # The grant, the decode-time allowlist, and the redaction that keeps a
      # protocol read from being a credential read.
      - name: Run Protocol Harness
        run: cargo run --release --example protocol -p crabtalk-harness

  typos:
    name: Typos
    runs-on: Linux
    steps:
      - uses: actions/checkout@v4
      - name: Check Typos
        run: typos
