[package]
name = "crabtalk-harness-sdk"
description = "Guest-side library for building Crabtalk harnesses"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["crabtalk", "harness", "sandbox", "riscv"]
readme = "README.md"

[lib]
# No host tests yet: the crate is `no_std`, so a test harness would need one
# written against the stubs below.
test = false

[features]
# Installs rvtime-guest's allocator and generates an `init` export for it.
default = ["alloc"]
alloc = ["rvtime-guest/alloc"]

[dependencies]
crabtalk-harness-codegen.workspace = true
rvtime-guest.workspace = true
