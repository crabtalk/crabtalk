# Standalone: excluded from the crabtalk workspace because it builds for RISC-V.
[workspace]

[package]
name = "crabtalk-harness-sdk"
description = "Guest-side library for building Crabtalk harnesses"
version = "0.0.23"
edition = "2024"
license = "MIT"
repository = "https://github.com/crabtalk/crabtalk"
keywords = ["crabtalk", "harness", "sandbox", "riscv"]
readme = "README.md"

[features]
# Installs rvtime-guest's allocator and generates an `init` export for it.
default = ["alloc"]
alloc = ["rvtime-guest/alloc"]

[dependencies]
# Builds for the host even here, so it lives in the workspace next door.
crabtalk-harness-codegen = { path = "../codegen", version = "0.0.23" }
rvtime-guest = { version = "0.0.1", default-features = false }
