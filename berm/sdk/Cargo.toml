[package]
name = "berm-sdk"
description = "Guest-side library for building Crabtalk harnesses"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["crabtalk", "harness", "sandbox", "riscv"]
readme = "README.md"

[lib]
# No host tests yet: the crate is `no_std`, so a test harness would need one
# written against the stubs below.
test = false

[features]
# Installs an allocator that takes its heap from the host on first use.
default = ["alloc", "args"]
alloc = ["dep:linked_list_allocator"]
# The protocol types are generated a second time for the guest, so a harness
# that never talks to the runtime does not link them.
protocol = ["alloc", "dep:proto", "dep:prost"]
# Typed tool arguments. On by default because a tool that takes none is the
# exception; a harness like `peers` can turn it off.
args = ["alloc", "dep:serde_guest", "dep:serde_json_guest"]

[dependencies]
berm-codegen.workspace = true
proto = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
rvtime-guest.workspace = true
serde_guest = { workspace = true, optional = true }
serde_json_guest = { workspace = true, optional = true }

# The allocator is installed as *the* global allocator, which only the guest's
# own target may do — off it, this crate is a library inside someone's tests and
# std already has one.
[target.'cfg(target_arch = "riscv64")'.dependencies]
linked_list_allocator = { workspace = true, optional = true }
