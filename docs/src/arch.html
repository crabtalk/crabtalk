<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>crabtalk — the workspace</title>
<style>
  :root {
    --bg:    #c9c3a1;
    --ink:   #16160e;
    --ink-2: rgba(22,22,14,.62);
    --ink-3: rgba(22,22,14,.34);
    --rule:  rgba(22,22,14,.30);
    --mono:  ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 12px;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  .cap { text-transform: uppercase; letter-spacing: .10em; }
  .hl  { background: var(--ink); color: var(--bg); padding: 0 .28em; }

  /* ---------- shell ---------- */
  #shell {
    display: grid;
    grid-template-columns: 208px minmax(0,1fr) 428px;
    grid-template-rows: 46px minmax(0,1fr);
    height: 100%;
  }
  #topbar { grid-column: 1 / -1; display: flex; align-items: stretch; border-bottom: 1px solid var(--ink); overflow: hidden; }
  #stats { display: flex; align-items: stretch; min-width: 0; overflow: hidden; }
  #side   { border-right: 1px solid var(--ink); overflow-y: auto; }
  #stage  { position: relative; overflow: hidden; }
  #panel  { border-left: 1px solid var(--ink); display: flex; flex-direction: column; min-height: 0; }

  /* ---------- topbar ---------- */
  #title {
    display: flex; align-items: center; gap: .6em;
    padding: 0 14px; min-width: 208px;
    border-right: 1px solid var(--ink);
    font-size: 13px; letter-spacing: .01em;
  }
  #title b { font-weight: 600; }
  #title span { color: var(--ink-2); }
  .stat {
    padding: 0 14px; border-right: 1px solid var(--ink);
    display: flex; flex-direction: column; justify-content: center; white-space: nowrap; flex: none;
  }
  .stat i { font-style: normal; font-size: 9px; letter-spacing: .12em; color: var(--ink-2); text-transform: uppercase; }
  .stat b { font-weight: 400; font-size: 13px; margin-top: 1px; }
  #controls { margin-left: auto; display: flex; }
  #controls button {
    padding: 0 15px; border-left: 1px solid var(--ink);
    font-size: 10px; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap;
  }
  #controls button:hover { background: rgba(22,22,14,.10); }
  #controls button.on { background: var(--ink); color: var(--bg); }

  /* ---------- sidebar ---------- */
  .grp { font-size: 9px; letter-spacing: .14em; color: var(--ink-2); padding: 13px 10px 5px; text-transform: uppercase; }
  .row {
    display: grid; grid-template-columns: 26px 1fr auto; align-items: start; gap: 5px;
    padding: 5px 8px 5px 6px; margin: 0 6px 2px;
    border: 1px solid transparent; cursor: pointer; line-height: 1.28;
  }
  .row:hover { border-color: var(--ink); }
  .row.sel   { border-color: var(--ink); background: var(--ink); color: var(--bg); }
  .row .k { font-size: 9px; color: var(--ink-2); padding-top: 1px; letter-spacing: .06em; }
  .row.sel .k, .row.sel .n { color: var(--bg); }
  .row .t { font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase; }
  .row .n { font-size: 9px; color: var(--ink-2); padding-top: 1px; }
  .row.mute .t { color: var(--ink-2); }
  .row.mute.sel .t { color: var(--bg); }

  /* ---------- stage ---------- */
  #svg { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #svg.drag { cursor: grabbing; }
  #zoom { position: absolute; top: 10px; right: 12px; display: flex; flex-direction: column; gap: 5px; }
  #zoom button { width: 22px; height: 22px; border: 1px solid var(--ink); line-height: 1; font-size: 13px; }
  #zoom button:hover { background: var(--ink); color: var(--bg); }
  #hint {
    position: absolute; left: 14px; bottom: 10px; right: 14px;
    font-size: 9.5px; letter-spacing: .11em; color: var(--ink-2); text-transform: uppercase;
    pointer-events: none;
  }
  #crumb { position: absolute; left: 14px; top: 12px; font-size: 10px; letter-spacing: .08em; }
  #crumb button { border-bottom: 1px solid var(--ink); padding-bottom: 1px; text-transform: uppercase; letter-spacing: .11em; }
  #crumb .sep { color: var(--ink-3); padding: 0 .5em; }

  .lbl { font-size: 9.5px; letter-spacing: .09em; text-transform: uppercase; pointer-events: none; }
  .lbl-sub { font-size: 8px; letter-spacing: .06em; fill: var(--ink-2); pointer-events: none; }

  /* ---------- panel ---------- */
  #tabs { display: flex; border-bottom: 1px solid var(--ink); flex: none; }
  #tabs button {
    flex: 1; padding: 10px 0; font-size: 10px; letter-spacing: .13em; text-transform: uppercase;
    border-right: 1px solid var(--ink);
  }
  #tabs button:last-child { border-right: 0; }
  #tabs button.on { background: var(--ink); color: var(--bg); }
  #body { overflow-y: auto; padding: 18px 22px 40px; min-height: 0; }
  #body h1 { font-size: 20px; font-weight: 500; letter-spacing: -.01em; margin: 2px 0 6px; line-height: 1.2; }
  #body .eyebrow { font-size: 9px; letter-spacing: .16em; color: var(--ink-2); text-transform: uppercase; }
  #body .dek { color: var(--ink-2); font-size: 11.5px; line-height: 1.55; margin-bottom: 20px; }
  #body h2 {
    font-size: 9px; letter-spacing: .16em; color: var(--ink-2); text-transform: uppercase;
    font-weight: 400; margin: 24px 0 9px; padding-bottom: 5px; border-bottom: 1px solid var(--rule);
  }
  #body p { font-size: 12.5px; line-height: 1.68; margin: 0 0 13px; }
  #body code { background: rgba(22,22,14,.12); padding: 0 .3em; font-size: 11.5px; }
  #body .meta { display: grid; grid-template-columns: auto 1fr; gap: 3px 16px; font-size: 11px; margin: 0 0 4px; }
  #body .meta dt { color: var(--ink-2); text-transform: uppercase; font-size: 9px; letter-spacing: .1em; padding-top: 2px; }
  #body .meta dd { margin: 0; }
  #body ul { margin: 0 0 13px; padding: 0; list-style: none; }
  #body li { font-size: 11.5px; line-height: 1.5; padding: 6px 0; border-bottom: 1px dotted var(--rule); display: grid; grid-template-columns: 1fr auto; gap: 12px; }
  #body li b { font-weight: 400; }
  #body li i { font-style: normal; color: var(--ink-2); font-size: 10px; white-space: nowrap; }
  #body li span { display: block; color: var(--ink-2); font-size: 10.5px; line-height: 1.45; grid-column: 1 / -1; margin-top: 2px; }
  #body li.on { background: var(--ink); color: var(--bg); margin: 0 -8px; padding: 6px 8px; }
  #body li.on i, #body li.on span { color: var(--bg); }
  #body .warn { border: 1px solid var(--ink); padding: 10px 12px; font-size: 11.5px; line-height: 1.55; margin: 0 0 13px; }
  #body .warn i { font-style: normal; display: block; font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 5px; }
  .step { display: grid; grid-template-columns: 26px 1fr; gap: 10px; padding: 7px 0; border-bottom: 1px dotted var(--rule); font-size: 11.5px; line-height: 1.5; }
  .step.on { background: var(--ink); color: var(--bg); margin: 0 -8px; padding: 7px 8px; }
  .step.on em, .step.on u { color: var(--bg); }
  .step .i { color: var(--ink-2); font-size: 9.5px; padding-top: 2px; }
  .step.on .i { color: var(--bg); }
  .step em { font-style: normal; color: var(--ink-2); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; display: block; margin-bottom: 2px; }
  .step u { text-decoration: none; color: var(--ink-2); font-size: 10px; display: block; margin-top: 3px; }

  @media (max-width: 1100px) {
    #shell { grid-template-columns: 168px minmax(0,1fr) 320px; }
  }
</style>
</head>
<body>
<div id="shell">
  <div id="topbar">
    <div id="title"><b>crabtalk</b><span>· v0.0.23</span></div>

</div>

/* ══════════════════════════════════════════════════════════════════════
   PROJECTION
   ══════════════════════════════════════════════════════════════════════ */

const HW = 26, HH = 15, HZ = 30;   // half tile width, half tile height, one z unit
const PITCH = 7;                   // grid cells between node centres

const proj = (x, y, z) => [ (x - y) * HW, (x + y) * HH - z * HZ ];
const pt   = (x, y, z) => proj(x, y, z).join(",");

/* The three visible faces of an axis-aligned box on the ground plane. */
function faces(x, y, w, d, h) {
  return {
    top:   [pt(x,y,h),   pt(x+w,y,h),   pt(x+w,y+d,h), pt(x,y+d,h)  ].join(" "),
    left:  [pt(x,y+d,h), pt(x+w,y+d,h), pt(x+w,y+d,0), pt(x,y+d,0)  ].join(" "),
    right: [pt(x+w,y,h), pt(x+w,y+d,h), pt(x+w,y+d,0), pt(x+w,y,0)  ].join(" "),
  };
}

const footprint = f => 1.3 + Math.sqrt(Math.max(f, 1)) * 0.55;
const height    = l => 0.25 + l / 1500;

/* Lay a node out from its (col,row) cell, centred in the cell. */
function place(n) {
  const w = footprint(n.files), d = w;
  return { ...n, w, d, h: height(n.loc), x: n.col * PITCH - w / 2, y: n.row * PITCH - d / 2 };
}

const SCENE = NODES.map(place);
const byId = Object.fromEntries(SCENE.map(n => [n.id, n]));
const centre = n => [n.x + n.w / 2, n.y + n.d / 2];

/* ══════════════════════════════════════════════════════════════════════
   STATE
   ══════════════════════════════════════════════════════════════════════ */

const view  = { tx: 0, ty: 0, s: 1 };
const state = { sel: "core", hover: null, inside: null, tab: "what", turn: -1, playing: false, timer: null };

const svg   = document.getElementById("svg");
const world = document.getElementById("world");
const SVGNS = "http://www.w3.org/2000/svg";

const el = (name, attrs = {}) => {
  const e = document.createElementNS(SVGNS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
};

/* ══════════════════════════════════════════════════════════════════════
   RENDER — diagram
   ══════════════════════════════════════════════════════════════════════ */

function defs() {
  const d = el("defs");
  const hatch = (id, angle, gap, width) => {
    const p = el("pattern", {
      id, width: gap, height: gap, patternUnits: "userSpaceOnUse",
      patternTransform: `rotate(${angle})`,
    });
    p.appendChild(el("line", {
      x1: 0, y1: 0, x2: 0, y2: gap,
      stroke: "var(--ink)", "stroke-width": width, "stroke-opacity": .5,
    }));
    return p;
  };
  d.appendChild(hatch("h-top", 45, 5, .7));
  d.appendChild(hatch("h-left", 45, 3.2, .7));
  d.appendChild(hatch("h-sel", 45, 2.2, 1.1));
  return d;
}

function ground(nodes) {
  const g = el("g");
  const xs = nodes.flatMap(n => [n.x, n.x + n.w]);
  const ys = nodes.flatMap(n => [n.y, n.y + n.d]);
  const x0 = Math.floor(Math.min(...xs)) - 3, x1 = Math.ceil(Math.max(...xs)) + 3;
  const y0 = Math.floor(Math.min(...ys)) - 3, y1 = Math.ceil(Math.max(...ys)) + 3;
  for (let x = x0; x <= x1; x += 1) {
    g.appendChild(el("line", {
      x1: proj(x, y0, 0)[0], y1: proj(x, y0, 0)[1],
      x2: proj(x, y1, 0)[0], y2: proj(x, y1, 0)[1],
      stroke: "var(--ink)", "stroke-width": .5, "stroke-opacity": .09,
    }));
  }
  for (let y = y0; y <= y1; y += 1) {
    g.appendChild(el("line", {
      x1: proj(x0, y, 0)[0], y1: proj(x0, y, 0)[1],
      x2: proj(x1, y, 0)[0], y2: proj(x1, y, 0)[1],
      stroke: "var(--ink)", "stroke-width": .5, "stroke-opacity": .09,
    }));
  }
  return g;
}

function edges(active) {
  const g = el("g");
  for (const [from, to] of EDGES) {
    const a = byId[from], b = byId[to];
    if (!a || !b) continue;
    const [ax, ay] = centre(a), [bx, by] = centre(b);
    const live = active && (from === active || to === active);
    const pts = [[ax, ay], [bx, ay], [bx, by]];
    g.appendChild(el("polyline", {
      points: pts.map(p => pt(p[0], p[1], 0)).join(" "),
      fill: "none", stroke: "var(--ink)",
      "stroke-width": live ? 1.6 : .8,
      "stroke-opacity": live ? .95 : (active ? .10 : .22),
    }));
    const [dx, dy] = proj(bx, ay, 0);
    g.appendChild(el("polygon", {
      points: `${dx},${dy-3.2} ${dx+3.2},${dy} ${dx},${dy+3.2} ${dx-3.2},${dy}`,
      fill: "var(--ink)", "fill-opacity": live ? .95 : (active ? .10 : .28),
    }));
  }
  return g;
}

/* The path a turn takes, drawn over the members it passes through. */
function turnPath() {
  const g = el("g");
  const seq = TURN.map(s => s.at).filter(Boolean);
  for (let i = 0; i < seq.length - 1; i++) {
    if (seq[i] === seq[i + 1]) continue;
    const a = byId[seq[i]], b = byId[seq[i + 1]];
    const [ax, ay] = centre(a), [bx, by] = centre(b);
    const done = state.turn >= 0 && i < indexOfStep(state.turn);
    g.appendChild(el("polyline", {
      points: [pt(ax, ay, 0), pt(bx, ay, 0), pt(bx, by, 0)].join(" "),
      fill: "none", stroke: "var(--ink)",
      "stroke-width": done ? 2.4 : 1.2,
      "stroke-opacity": done ? .9 : .3,
      "stroke-dasharray": done ? "none" : "3 4",
    }));
  }
  return g;
}

/* How many path segments have been walked by the time we reach step i. */
function indexOfStep(i) {
  let k = 0;
  for (let j = 1; j <= i && j < TURN.length; j++) {
    if (TURN[j].at && TURN[j - 1].at && TURN[j].at !== TURN[j - 1].at) k++;
  }
  return k;
}

function box(n, opts = {}) {
  const g = el("g", { class: "node", "data-id": n.id });
  g.style.cursor = "pointer";
  const f = faces(n.x, n.y, n.w, n.d, n.h);
  const { on, dim, hot } = opts;

  // Faces are always opaque so a box occludes the grid and the lines behind it.
  // Two highlight states: `on` (selected) thickens the line and doubles the
  // hatch; `hot` (the step a turn is on) goes to a solid ink silhouette.
  const face = (points, hatch) => {
    g.appendChild(el("polygon", { points, fill: hot ? "var(--ink)" : "var(--bg)" }));
    if (!hot && hatch) {
      g.appendChild(el("polygon", {
        points, fill: `url(#${on ? "h-sel" : hatch})`, "fill-opacity": dim ? .28 : 1,
      }));
    }
    g.appendChild(el("polygon", {
      points, fill: "none", stroke: "var(--ink)",
      "stroke-width": on || hot ? 1.8 : 1, "stroke-opacity": dim ? .28 : 1,
      "stroke-linejoin": "round",
    }));
  };

  face(f.left,  "h-left");
  face(f.right, null);
  face(f.top,   "h-top");

  if (n.code) {
    const [cx, cy] = proj(n.x + n.w / 2, n.y + n.d / 2, n.h);
    const label = el("text", {
      x: cx, y: cy + 3, class: "lbl", "text-anchor": "middle",
      fill: hot ? "var(--bg)" : "var(--ink)", "fill-opacity": dim ? .35 : 1,
    });
    label.textContent = n.code;
    g.appendChild(label);
  }

  // Caption sits under the base's bottom vertex, clear of the box itself.
  const [bx, byc] = proj(n.x + n.w / 2, n.y + n.d / 2, 0);
  const by = byc + ((n.w + n.d) / 2) * HH;
  const cap = el("text", {
    x: bx, y: by + 15, class: "lbl", "text-anchor": "middle",
    fill: "var(--ink)", "fill-opacity": dim ? .28 : (on ? 1 : .8),
  });
  cap.textContent = (n.name || n.n).toUpperCase();
  g.appendChild(cap);

  const sub = el("text", { x: bx, y: by + 26, class: "lbl-sub", "text-anchor": "middle", "fill-opacity": dim ? .2 : .6 });
  sub.textContent = `${n.loc.toLocaleString()} lines`;
  g.appendChild(sub);

  return g;
}

function draw() {
  world.textContent = "";
  world.appendChild(defs());

  const nodes = state.inside ? insideScene(state.inside) : SCENE;
  const active = state.hover || state.sel;

  world.appendChild(ground(nodes));

  if (!state.inside) {
    world.appendChild(edges(active));
    if (state.turn >= 0) world.appendChild(turnPath());
  }

  const here = state.turn >= 0 ? TURN[state.turn].at : null;
  const sorted = [...nodes].sort((a, b) => (a.x + a.y) - (b.x + b.y));
  for (const n of sorted) {
    const hot = n.id === here;
    const on  = n.id === active && !hot;
    world.appendChild(box(n, { on, hot, dim: state.turn >= 0 && !hot && !on }));
  }
  apply();
}

/* Sub-scene: one member's modules, laid out on their own grid. */
function insideScene(id) {
  const parent = byId[id];
  const items = parent.inside;
  if (!items.length) return [];
  const cols = Math.ceil(Math.sqrt(items.length));
  return items.map((m, i) => {
    const w = footprint(m.f), col = i % cols, row = Math.floor(i / cols);
    return {
      id: `${id}/${m.n}`, code: null,   // the caption underneath already names it
      name: m.n, loc: m.loc, files: m.f, note: m.note,
      w, d: w, h: height(m.loc),
      x: col * 6 - w / 2, y: row * 6 - w / 2,
    };
  });
}

function apply() {
  world.setAttribute("transform", `translate(${view.tx},${view.ty}) scale(${view.s})`);
}

function fit() {
  const nodes = state.inside ? insideScene(state.inside) : SCENE;
  if (!nodes.length) { view.tx = svg.clientWidth / 2; view.ty = svg.clientHeight / 2; view.s = 1; return apply(); }
  const xs = [], ys = [];
  for (const n of nodes) {
    for (const [a, b, c] of [[n.x,n.y,0],[n.x+n.w,n.y,0],[n.x,n.y+n.d,0],[n.x+n.w,n.y+n.d,0],
                             [n.x,n.y,n.h],[n.x+n.w,n.y,n.h],[n.x,n.y+n.d,n.h],[n.x+n.w,n.y+n.d,n.h]]) {
      const [px, py] = proj(a, b, c); xs.push(px); ys.push(py);
    }
  }
  const pad = 90;
  const w = Math.max(...xs) - Math.min(...xs) + pad * 2;
  const h = Math.max(...ys) - Math.min(...ys) + pad * 2;
  view.s = Math.min(svg.clientWidth / w, svg.clientHeight / h, 1.5);
  view.tx = svg.clientWidth / 2 - ((Math.min(...xs) + Math.max(...xs)) / 2) * view.s;
  view.ty = svg.clientHeight / 2 - ((Math.min(...ys) + Math.max(...ys)) / 2) * view.s;
  apply();
}

        <div class="n">${n.inside.length || "·"}</div>
      </div>`).join("");
    return `<div class="grp">${label}</div>${rows}`;
  }).join("");
  side.querySelectorAll(".row").forEach(r => {
    r.onclick = () => select(r.dataset.id);

      <dt>size</dt><dd>${n.loc.toLocaleString()} lines · ${n.files} file${n.files === 1 ? "" : "s"}</dd>
      <dt>depends on</dt><dd>${depsOf(n.id) || "nothing in the workspace"}</dd>
      <dt>used by</dt><dd>${usersOf(n.id) || "nothing in the workspace"}</dd>
    </dl>`;

  if (state.tab === "what") {
    b.innerHTML = `
      <div class="eyebrow">${GROUPS.find(g => g[0] === n.group)[1]}</div>
      <h1>${n.name}</h1>
      <div class="dek">${n.pkg}</div>
      <h2>What it does</h2>
      <p>${n.what}</p>
      ${n.note ? `<div class="warn"><i>Worth knowing</i>${n.note}</div>` : ""}
      <h2>At a glance</h2>
      ${meta}
      ${n.inside.length ? `<h2>Inside</h2><ul>${n.inside.map(m =>
        `<li class="${state.hover === `${n.id}/${m.n}` ? "on" : ""}"><b>${m.n}</b><i>${m.loc.toLocaleString()} · ${m.f}f</i><span>${m.note}</span></li>`).join("")}</ul>
        <p><button class="hl" id="go-in">${inside ? "you are inside" : "→ go inside"}</button></p>` : ""}`;
  } else {
    b.innerHTML = `
      <div class="eyebrow">${n.pkg}</div>
      <h1>${n.name}</h1>
      <div class="dek">${n.path}</div>
      <h2>How it's built</h2>
      <p>${n.how}</p>
      <h2>At a glance</h2>
      ${meta}`;
  }

  b.scrollTop = top;
  const go = document.getElementById("go-in");
  if (go) go.onclick = () => enter(n.id);
}

const depsOf  = id => EDGES.filter(e => e[0] === id).map(e => byId[e[1]].name).join(", ");
const usersOf = id => EDGES.filter(e => e[1] === id).map(e => byId[e[0]].name).join(", ");

/* ══════════════════════════════════════════════════════════════════════
   INTERACTION
   ══════════════════════════════════════════════════════════════════════ */

function select(id) {
  if (!byId[id]) return;
  state.sel = id;
  if (state.inside && state.inside !== id) state.inside = null;
  if (state.tab === "turn") setTab("what");
  draw(); drawSide(); drawBody(); drawCrumb();
}

function enter(id) {
  if (!byId[id] || !byId[id].inside.length) return;
  state.sel = id; state.inside = id;
  draw(); fit(); drawSide(); drawBody(); drawCrumb();
}

function setTab(tab) {
  state.tab = tab;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  drawBody();
}

function goStep(i) {
  state.turn = ((i % TURN.length) + TURN.length) % TURN.length;
  const at = TURN[state.turn].at;
  if (at) state.sel = at;
  if (state.inside) state.inside = null;
  setTab("turn");
  draw(); drawSide(); drawCrumb();
}

function play(on) {
  state.playing = on;
  document.getElementById("btn-play").classList.toggle("on", on);
  document.getElementById("btn-play").textContent = on ? "❚❚ Pause the turn" : "▶ Run a turn";
  clearInterval(state.timer);
  if (on) {
    if (state.turn < 0) goStep(0);
    state.timer = setInterval(() => {
      if (state.turn >= TURN.length - 1) return play(false);
      goStep(state.turn + 1);
    }, 2200);
  }
}

document.getElementById("btn-play").onclick  = () => play(!state.playing);
document.getElementById("btn-step").onclick  = () => { play(false); goStep(state.turn + 1); };
document.getElementById("btn-reset").onclick = () => {
  play(false);
  state.turn = -1; state.inside = null; state.hover = null;
  setTab("what"); draw(); fit(); drawSide(); drawCrumb();
};
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => setTab(b.dataset.tab));
document.getElementById("z-in").onclick  = () => { view.s = Math.min(view.s * 1.25, 4); apply(); };
document.getElementById("z-out").onclick = () => { view.s = Math.max(view.s / 1.25, .2); apply(); };

/* pan + zoom */
let drag = null;
svg.addEventListener("pointerdown", e => {
  drag = { x: e.clientX, y: e.clientY, tx: view.tx, ty: view.ty };
  svg.classList.add("drag"); svg.setPointerCapture(e.pointerId);
});
svg.addEventListener("pointermove", e => {
  if (!drag) return;
  view.tx = drag.tx + (e.clientX - drag.x);
  view.ty = drag.ty + (e.clientY - drag.y);
  apply();
});
svg.addEventListener("pointerup", e => { drag = null; svg.classList.remove("drag"); });
svg.addEventListener("wheel", e => {
  e.preventDefault();
  const r = svg.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const k = Math.exp(-e.deltaY * 0.0015);
  const s = Math.max(.2, Math.min(4, view.s * k));
  view.tx = mx - (mx - view.tx) * (s / view.s);
  view.ty = my - (my - view.ty) * (s / view.s);
  view.s = s; apply();
}, { passive: false });

/* hover + click on boxes */
// Inside a member, re-rendering the whole panel on every hover would reset its
// scroll — just move the highlight down the Inside list instead.
function markRow() {
  const n = byId[state.sel];
  document.querySelectorAll("#body li").forEach((li, i) => {
    const m = n.inside[i];
    const on = m && state.hover === `${n.id}/${m.n}`;
    li.classList.toggle("on", !!on);
    if (on) li.scrollIntoView({ block: "nearest" });
  });
}

world.addEventListener("mouseover", e => {
  const g = e.target.closest(".node");
  if (!g || state.hover === g.dataset.id) return;
  state.hover = g.dataset.id;
  draw();
  state.inside ? markRow() : drawBody();
});
world.addEventListener("mouseout", e => {
  if (!e.target.closest(".node") || state.hover === null) return;
  state.hover = null;
  draw();
  state.inside ? markRow() : drawBody();
});
world.addEventListener("click", e => {
  const g = e.target.closest(".node");
  if (!g || state.inside) return;
  select(g.dataset.id);
});

/* keyboard */
document.addEventListener("keydown", e => {
  const order = SCENE.map(n => n.id);
  const i = order.indexOf(state.sel);
  if (e.key === "ArrowDown")      { e.preventDefault(); select(order[(i + 1) % order.length]); }
  else if (e.key === "ArrowUp")   { e.preventDefault(); select(order[(i - 1 + order.length) % order.length]); }
  else if (e.key === "ArrowRight"){ e.preventDefault(); enter(state.sel); }
  else if (e.key === "ArrowLeft" || e.key === "Escape") {
    e.preventDefault();
    if (state.inside) { state.inside = null; draw(); fit(); drawBody(); drawCrumb(); }
  }
  else if (e.key === " ")         { e.preventDefault(); play(!state.playing); }
});

window.addEventListener("resize", fit);

/* go */
drawStats(); drawSide(); draw(); fit(); drawBody(); drawCrumb();
</script>
</body>
</html>
